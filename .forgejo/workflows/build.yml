name: Build
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ci
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        run: |
          if ! command -v nix &>/dev/null; then
            curl -fsSL https://nixos.org/nix/install | sh
          fi
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
          echo "/nix/var/nix/profiles/default/bin" >> $GITHUB_PATH
      - name: Build
        run: nix build . --print-build-logs
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_JSON=$(curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"kb.ai ${TAG}\"}")
          echo "$RELEASE_JSON"
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=kbai-linux-amd64" \
            --data-binary @result/bin/kbai
