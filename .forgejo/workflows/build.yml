name: Build
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ci
    container:
      image: node:latest
    steps:
      - name: Install Nix
        run: |
          curl -fsSL https://nixos.org/nix/install | sh -s -- --no-daemon
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
          echo "/root/.nix-profile/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
      - name: Build
        run: nix build . --print-build-logs
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          RELEASE_JSON=$(curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"kb.ai ${TAG}\"}" 2>/dev/null)
          if echo "$RELEASE_JSON" | grep -q '"id"'; then
            RELEASE_ID=$(echo "$RELEASE_JSON" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          else
            RELEASE_ID=$(curl -s \
              -H "Authorization: token $GITEA_TOKEN" \
              "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/tags/${TAG}" \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi
          curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=kbai-linux-amd64" \
            --data-binary @result/bin/kbai
