name: Build
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ci
    container:
      image: nixos/nix:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          nix build . --print-build-logs
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kbai
          path: result/bin/kbai

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ci
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: kbai
      - name: Create release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create release via Forgejo API
          RELEASE_JSON=$(curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"kb.ai ${TAG}\"}")
          echo "$RELEASE_JSON"
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          # Upload binary as release asset
          curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=kbai-linux-amd64" \
            --data-binary @kbai
