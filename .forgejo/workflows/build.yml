name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache (magic-nix-cache)
        uses: https://github.com/DeterminateSystems/magic-nix-cache-action@v8

      - name: Build (Linux)
        run: nix build . -o result-linux --print-build-logs

      - name: Build (Windows cross-compile)
        run: nix build .#windows -o result-windows --print-build-logs

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v3
        with:
          name: kbai-linux
          path: ./result-linux/bin/kbai
          retention-days: 7

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: kbai-windows
          path: ./result-windows/bin/kbai.exe
          retention-days: 7

  release:
    runs-on: ci
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: https://github.com/DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache (magic-nix-cache)
        uses: https://github.com/DeterminateSystems/magic-nix-cache-action@v8

      - name: Build Linux binary
        run: nix build . -o result-linux --print-build-logs

      - name: Build Windows binary
        run: nix build .#windows -o result-windows --print-build-logs

      - name: Collect release artifacts
        run: |
          mkdir -p release-dir
          cp result-linux/bin/kbai release-dir/kbai-linux-x86_64
          cp result-windows/bin/kbai.exe release-dir/kbai-windows-x86_64.exe

      - name: Publish release
        uses: actions/forgejo-release@v2.5.0
        with:
          direction: upload
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: ./release-dir/
          release-notes-assistant: true
          override: true
