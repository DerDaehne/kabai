name: Build
on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ci
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install nix
        uses: https://github.com/determinateSystems/nix-installer-action@v12

      - name: nix build
        run: nix build . --print-build-logs

      - name: upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kbai
          path: ./result/bin/kbai
          archive: false
          retention-days: 5

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/forgejo-release@v2.5.0
        with:
          direction: upload
          token: ${{ secrets.GITHUB_TOKEN }}
          release-dir: ./result/bin/
          release-notes-assistant: true
          override: true
