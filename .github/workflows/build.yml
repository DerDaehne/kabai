name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache (magic-nix-cache)
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build
        run: nix build . --print-build-logs

      - name: Build (Windows)
        run: nix build .#windows -o result-windows --print-build-logs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kbai-linux
          path: ./result/bin/kbai
          retention-days: 7

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: kbai-windows
          path: ./result-windows/bin/kabai.exe
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Enable Nix cache (magic-nix-cache)
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build release binary
        run: nix build . --print-build-logs

      - name: Build release binary (Windows)
        run: nix build .#windows -o result-windows --print-build-logs

      - name: Collect release artifacts
        run: |
          mkdir -p release-dir
          cp result/bin/kbai release-dir/kbai-linux-x86_64
          cp result-windows/bin/kabai.exe release-dir/kabai-windows-x86_64.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dir/*
          generate_release_notes: true
